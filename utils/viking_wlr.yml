seed: 19491001

observed: # Information for modeling the observed data

  observed_data_path: data/Viking_data/viking_shots_deepwave_1001x120x1500.npy

  solver: # Settings for the solver

    equation: 
      name: Deepwave # Equation to be used for modeling, options: Acoustic, Elastic, Viscoelastic, etc.
      spatial_order: 8 # Order of the spatial discretization

    source_type:
      - p
    receiver_type:
      - p

    abcn: 50
    free_surface: true

  model_scale_x: 1 # Downsample the model in x direction
  model_scale_z: 1 # Downsample the model in z direction

  use_mini_batch: False # Use mini-batch for modeling, otherwise all shots are modeled at once
  batch_size: 10 # number of shots in a batch for avoiding OOM

  solver:
    spatial_order: 8 # Order of the spatial discretization

  geom:

    models:
      #rho: /ibex/user/wangl0n/field_data/cgg/rho_constant1.npy
      vp: data/Viking_data/Initial_v.npy

    dh: 12.5 # Grid spacing in meters for both x and z directions

    source_path: # Source .npy file with shape (nshots, 2), (in grid points)
    receiver_path: # Receiver .npy file with shape (nshots, nreceivers, 2), (in grid points)

    sources: # if source_path is not provided, the source will be generated by the following parameters
      source_start: 0 # Source starting position in grid points
      source_end: -1 # Source ending position in grid points, -1 means the last grid point
      source_interval: 2 # Source interval in grid points
      source_depth: 0 # Source depth in grid points

    receivers: # if receiver_path is not provided, the receiver will be generated by the following parameters
      receiver_start: 0 # Receiver starting position in grid points
      receiver_end: -1 # Receiver ending position in grid points
      receiver_interval: 1 # Receiver interval in grid points
      receiver_depth: 0 # Receiver depth in grid points

  wavelet:
    path: # Path to the wavelet .npy file, if not provided, the wavelet will be generated by the following parameters
    dt: 0.002 # Time step of the wavlet
    fm: 8 # Dominant frequency of the Ricker wavelet
    delay: 0.5 # seconds
    time: 5.0 # seconds
    

inversion: # Settings for the Implicit Full Waveform Inversion (IFWI)

  seed: 19491001

  solver: # Settings for the solver

    equation: 
      name: Deepwave # Equation to be used for modeling, options: Acoustic, Elastic, Viscoelastic, etc.
      spatial_order: 8 # Order of the spatial discretization

    source_type:
      - p
    receiver_type:
      - p

    abcn: 50
    free_surface: true

  grid:
    min: 0. # Normalized minimum value of the coordinates
    max: 1. # Normalized maximum value of the coordinates

  inv_params:
    - vp

  observed_data_path: data/Viking_data/viking_shots_deepwave_1001x120x1500.npy # Path to the observed data (only .npy format is supported)

  use_init: true # Use the initial model for the inversion

  training:
    eps: 1e-12 # Small value for avoiding division by zero in Adam optimizer
    epochs: 401
    lr: 0.0001 # DON'T USE 1e-4, use 0.0001 instead
    lr_decay: 0.998 # Learning rate decay
    steps_per_epoch: 24 # Steps for accumulating gradients, if multigpu is used, shots_per_gpu = batchsize // steps_per_epoch // num_gpus
    show_every: 10
    save_every: 25
    batchsize:
      - 96 #!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
      - 96
      - 144
      - 144
      - 240
      - 240
      - 480
      - 480

    lr_legacy_vp: 10.
    lr_legacy_m: 0.0001

  networks:

    use_pretrain: False # Use the pre-trained model
    pretrain_path:

    # omega: 10. # Frequency of the Sine activation for all layers except the last layer
    omega: 30.
    num_layers: 2 # Number of hidden layers
    hidden_dim: 128 # Number of neurons in each hidden layer

    hash_config:
      base_resolution: 16
      dim: 2
      finest_resolution: 512
      # finest_resolution: 1024
      interpolation: linear
      log2_hashmap_size: 18
      # log2_hashmap_size: 22
      n_features_per_level: 1
      n_levels: 16

  multiscale:
    frequencies:
      - - 3.0
        - 6.0
      - - 3.0
        - 8.0
      - - 3.0
        - 10.0
      - - 3.0
        - 12.0
      - - 3.0
        - 14.0
      - - 3.0
        - 16.0
      - - 3.0
        - 18.0
      - - 3.0
        - 20.0
  geom:

    models:
      #rho: /ibex/user/wangl0n/field_data/cgg/data/rho_constant1.npy
      vp: data/Viking_data/Initial_v.npy
      

    max_depth: 4500 #m
    dh: 12.5
    source_path: data/Viking_data/viking_source_deepwave_wlr.npy # Source .npy file with shape (nshots, 2), (in grid points)
    receiver_path: data/Viking_data/viking_receiver_deepwave_wlr.npy  # Receiver .npy file with shape (nshots, nreceivers, 2), (in grid points)
    receivers:
      receiver_depth: 0
      receiver_end: -1
      receiver_interval: 2
      receiver_start: 0
    sources:
      source_depth: 0
      source_end: -1
      source_interval: 2
      source_start: 0
  
  wavelet:
    path: data/Viking_data/new_wavelet.npy
    dt: 0.004 # Time step of the wavlet
    fm: 20 # Dominant frequency of the Ricker wavelet
    delay: 0.5 # seconds
    time: 6.0
    endt: 6.0